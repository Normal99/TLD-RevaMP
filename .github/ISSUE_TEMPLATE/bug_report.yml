name: Bug report
description: Something went wrong in game
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. In multiplayer, say who hosted and what the other player saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TLD RevaMP version
      description: The version in the release zip's name. Everyone in a session needs the same one.
      placeholder: "0.68.2"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Single player, Multiplayer (I hosted), Multiplayer (I joined), Dedicated server]
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug details and when it happened
      description: >
        Do NOT attach report zips, marks or play logs: GitHub issues are public. Describe the bug and when it happened
        instead, without telemetry or summaries from the files. Keep the files on your PC; the developers will ask
        for them privately if needed. Do not upload them to GitHub, gists, pastebins or other services.
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Windows 11 / Linux + Proton 9"
