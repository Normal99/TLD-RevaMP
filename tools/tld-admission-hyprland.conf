# EMERGENCY ONLY: protect the desktop after a genuine global OOM.
#
# Do not install this file proactively.  Install it as a user-systemd drop-in
# only after the admission guard has demonstrated that a lower-priority job is
# exhausting the host, and remove it after the session has recovered:
#
#   unit=wayland-wm@hyprland.desktop.service
#   install -d "$HOME/.config/systemd/user/${unit}.d"
#   cp tools/tld-admission-hyprland.conf \
#      "$HOME/.config/systemd/user/${unit}.d/90-emergency-memory.conf"
#   systemctl --user daemon-reload
#   systemctl --user restart "$unit"
#
# This barrier limits Hyprland's cgroup (and descendants) to 7G RAM and 2G swap
# while leaving at least 2G headroom in the compositor itself under the 10G
# session-anonymous threshold.  It is intentionally not enabled by Make or by
# the admission broker.  Verify the active value after any future restart:
#   systemctl --user show wayland-wm@hyprland.desktop.service \
#     -p MemoryHigh -p MemoryMax -p MemorySwapMax -p ManagedOOMPreference
[Service]
MemoryHigh=6G
MemoryMax=7G
MemorySwapMax=2G
ManagedOOMPreference=avoid
